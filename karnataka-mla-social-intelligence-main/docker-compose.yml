services:
  db:
    image: postgres:16
    container_name: mla_social_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mla_social
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
